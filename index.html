<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Coach - 你的人生教练</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 页面主容器 -->
    <div class="container">
        <!-- 头部区域 -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🌱</span>
                <h1>Life Coach</h1>
            </div>
            <p class="subtitle">你的人生教练，陪伴你成长</p>
        </header>

        <!-- 对话区域 -->
        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <!-- 欢迎消息 -->
                <div class="message assistant-message">
                    <div class="message-avatar">🧭</div>
                    <div class="message-content">
                        <p>你好！我是你的 Life Coach，很高兴能陪伴你成长。</p>
                        <p>无论你是想讨论职业发展、人际关系、个人目标，还是生活中的任何困惑，我都在这里倾听并帮助你。</p>
                        <p>请告诉我，今天想聊些什么？</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- 输入区域 -->
        <footer class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="userInput" 
                    placeholder="输入你的想法或问题..." 
                    rows="1"
                ></textarea>
                <button id="sendBtn" class="send-btn" title="发送消息">
                    <span class="send-icon">➤</span>
                </button>
            </div>
            <p class="input-hint">按 Enter 发送，Shift + Enter 换行</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
