<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Django Chapter 1-8 互动题库</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f6f8fb;color:#1f2937}.box{text-align:center;padding:32px}.spin{width:40px;height:40px;border:4px solid #dbe3ef;border-top-color:#2563eb;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><div id="msg">正在加载 Django 互动题库（400题）…</div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('当前浏览器版本过旧，请使用最新版 Chrome 或 Edge。');const parts=await Promise.all([0,1,2,3].map(i=>fetch(`data/part${i}.bin`).then(r=>{if(!r.ok)throw new Error('题库数据加载失败');return r.arrayBuffer()})));const arrays=parts.map(b=>new Uint8Array(b));const total=arrays.reduce((n,a)=>n+a.length,0);const merged=new Uint8Array(total);let offset=0;for(const a of arrays){merged.set(a,offset);offset+=a.length}const stream=new Blob([merged]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').textContent='加载失败：'+e.message}})();</script></body></html>
